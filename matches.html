<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe | Matches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand-wrap">
            <div class="logo">VIBE</div>
            <span class="nav-status">Discover</span>
        </div>
        <nav aria-label="Main navigation" class="top-nav">
            <a href="index.html">Home</a>
            <a href="signup.html">Profile</a>
            <a href="matches.html">Matches</a>
            <a href="people.html">Members</a>
            <a href="chat.html">Chat</a>
            <a href="#" class="sign-out-link">Sign out</a>
        </nav>
    </header>

    <main class="page-shell matches-layout">
        <section class="phone-shell matches-shell">
            <div class="phone-topbar">
                <span>Vibe</span>
                <span class="dot-indicator"></span>
            </div>

            <div class="profile-card" id="match-card">
                <div class="card-badge" id="match-badge">89% match</div>
                <div class="profile-meta">
                    <h3 id="match-name">Maya</h3>
                    <p id="match-meta">27 • Brooklyn</p>
                </div>
                <div class="tag-row" id="match-tags">
                    <span>Live music</span>
                    <span>coffee runs</span>
                </div>
            </div>

            <div class="status-box" id="status-text">Fresh potential match loaded.</div>

            <div class="action-row">
                <button class="pass-btn" id="pass-button" type="button">Pass</button>
                <button class="vibe-btn" id="vibe-button" type="button">Vibe</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vibe Dating Engine. Data encrypted securely.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
