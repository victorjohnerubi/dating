<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand-wrap">
            <div class="logo">VIBE</div>
            <span class="nav-status">Welcome back</span>
        </div>
        <nav aria-label="Main navigation" class="top-nav">
            <a href="index.html">Home</a>
            <a href="signup.html">Create profile</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="form-container signup-form">
            <h2>Sign In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
            <p class="auth-switch">New to Vibe? <a href="signup.html">Create your profile</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vibe Dating Engine.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
